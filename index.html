    --stay:#17876a; --stay-bg:#e2f3ec; --stay-tx:#0e5a44; --stay-wash:#ffffff;
    --vol:#3b82c4;  --vol-bg:#e5eefb;  --vol-tx:#24557f;  --vol-wash:#f5f9fe;
    --inv:#7c5cff;  --inv-bg:#ece7ff;  --inv-tx:#4a37a8;  --inv-wash:#f8f6ff;
    --lmar:#d64550; --lmar-bg:#fbe4e6; --lmar-tx:#a12730; --lmar-wash:#fdf5f5;
    --lmay:#e08a2b; --lmay-bg:#fbeed9; --lmay-tx:#8f561a; --lmay-wash:#fdf8f0;
    --pdv:#8b93a7;  --pdv-bg:#ebedf2;  --pdv-tx:#4f5665;  --pdv-wash:#f7f8fa;
    --new:#0ea5a5;  --new-bg:#d7f2f0;  --new-tx:#0a6b68;  --new-wash:#f2fbfa;
    --display:'Space Grotesk', -apple-system, sans-serif;
    --body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--body);background:var(--paper);color:var(--ink);overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  header{padding:12px 22px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:10}

  .tabs{display:inline-flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs button{font-family:var(--display);font-size:14px;font-weight:600;border:none;background:none;color:var(--ink-2);
    padding:8px 22px;border-radius:9px;cursor:pointer;letter-spacing:.2px}
  .tabs button.on{background:var(--ink);color:#fff}

  .toprow{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .titleblock h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.2px}
  .titleblock .sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
  .spacer{flex:1}

  .kpis{display:flex;align-items:center;gap:26px;margin-top:15px;flex-wrap:wrap}
  .kpi{display:flex;flex-direction:column;gap:1px}
  .kpi .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
  .kpi .k{font-size:11px;color:var(--ink-2);letter-spacing:.3px;text-transform:uppercase;font-weight:600}
  .kpi .sub{font-size:11px;color:var(--lmar-tx);font-weight:700;margin-top:2px}
  .kpi.drop .v{color:var(--lmar)}
  .kop{align-self:flex-start;margin-top:4px;font-family:var(--display);font-size:22px;font-weight:400;color:var(--ink-2)}
  .barwrap{flex:1;min-width:260px}
  .barwrap .caption{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-bottom:5px}
  .bar{display:flex;height:16px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .bar span{display:block;height:100%}
  .bar span:hover{filter:brightness(.92)}

  #stage{position:relative;flex:1;overflow:hidden;cursor:grab;
    background:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0/24px 24px, var(--paper)}
  #stage.grabbing{cursor:grabbing}
  svg#tree{width:100%;height:100%;display:block}
  .link{fill:none;stroke:#c4c8d4;stroke-width:1.5px}
  .link.on-path{stroke:var(--ink);stroke-width:2.2px}

  .node-card{height:100%;border-radius:11px;padding:9px 12px 9px 13px;background:var(--card);
    border:1px solid var(--line);border-left:6px solid var(--pdv);
    display:flex;flex-direction:column;justify-content:center;gap:3px;
    box-shadow:0 1px 3px rgba(20,20,50,.07);cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .2s;overflow:hidden}
  .node-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(20,20,50,.14)}
  .node-inner{position:relative}
  .node-name{font-size:13px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .node-role{font-size:11px;color:var(--ink-2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node-tags{display:flex;gap:5px;align-items:center;margin-top:2px}
  .tag{font-size:9px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:20px;line-height:1;white-space:nowrap}
  .tag.dept{background:#eef0f5;color:#5a6072;text-transform:uppercase;font-size:8.5px}
  .tag.count{background:#eef0f5;color:#5a6072;font-size:8.5px}

  .st-stay{border-left-color:var(--stay);background:var(--stay-wash)}  .st-stay .tag.status{background:var(--stay-bg);color:var(--stay-tx)}
  .st-vol{border-left-color:var(--vol);background:var(--vol-wash)}     .st-vol .tag.status{background:var(--vol-bg);color:var(--vol-tx)}
  .st-inv{border-left-color:var(--inv);background:var(--inv-wash)}     .st-inv .tag.status{background:var(--inv-bg);color:var(--inv-tx)}
  .st-lmar{border-left-color:var(--lmar);background:var(--lmar-wash)}  .st-lmar .tag.status{background:var(--lmar-bg);color:var(--lmar-tx)}
  .st-lmay{border-left-color:var(--lmay);background:var(--lmay-wash)}  .st-lmay .tag.status{background:var(--lmay-bg);color:var(--lmay-tx)}
  .st-pdv{border-left-color:var(--pdv);background:var(--pdv-wash)}     .st-pdv .tag.status{background:var(--pdv-bg);color:var(--pdv-tx)}
  .st-new{border-left-color:var(--new);background:var(--new-wash)}     .st-new .tag.status{background:var(--new-bg);color:var(--new-tx)}
  .st-root{border-left-color:var(--ink);background:var(--ink)}
  .st-root .node-name,.st-root .node-role{color:#fff}

  .sc-global{border-left-color:var(--inv);background:var(--inv-wash)}   .sc-global .tag.status{background:var(--inv-bg);color:var(--inv-tx)}
  .sc-mx{border-left-color:var(--vol);background:var(--vol-wash)}       .sc-mx .tag.status{background:var(--vol-bg);color:var(--vol-tx)}
  .sc-br{border-left-color:var(--lmay);background:var(--lmay-wash)}     .sc-br .tag.status{background:var(--lmay-bg);color:var(--lmay-tx)}
  .sc-other{border-left-color:var(--pdv);background:var(--pdv-wash)}    .sc-other .tag.status{background:var(--pdv-bg);color:var(--pdv-tx)}

  .node.dim .node-card{opacity:.24;box-shadow:none}
  .node.match .node-card{outline:3px solid #ffcf3f;outline-offset:1px}

  .chev{font-size:11px;color:var(--ink-2);width:14px;flex:none;margin-top:3px;line-height:1;user-select:none}
  .chev-spacer{width:14px;flex:none}

  .toggle{position:absolute;left:50%;transform:translateX(-50%);bottom:-13px;min-width:26px;height:26px;padding:0 9px;
    border-radius:14px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;color:var(--ink);box-shadow:0 3px 7px rgba(20,20,50,.18);white-space:nowrap;font-family:var(--display)}

  .floaters{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zbtn{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(20,20,50,.08)}
  .zbtn:hover{border-color:var(--ink)}
  .zbtn.small{font-size:11px;font-weight:600;font-family:var(--body)}

  .legend .row{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:12px;cursor:pointer;user-select:none}
  .legend .row.off{opacity:.4}
  .legend .sw{width:16px;height:16px;border-radius:5px;flex:none}
  .legend .ct{margin-left:auto;font-family:var(--display);font-weight:600;color:var(--ink-2);font-size:11px;padding-left:12px}

  .syncpill{position:absolute;left:16px;top:16px;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-size:11px;z-index:5;color:var(--ink-2);display:flex;align-items:center;gap:7px;box-shadow:0 2px 6px rgba(20,20,50,.08)}

  .dotsync.live{background:var(--stay);box-shadow:0 0 0 3px rgba(23,135,106,.16)}
  .dotsync.snap{background:var(--lmay)}
  .dotsync.loading{background:var(--vol);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .field{position:relative;display:flex;align-items:center}
  .field svg{position:absolute;left:11px;width:15px;height:15px;color:var(--ink-2);pointer-events:none}

  input[type="search"]:focus{border-color:var(--ink)}
  ::placeholder{color:var(--ink-2)}
  @media (max-width:760px){ .legend{display:none} input[type="search"]{width:130px} .kpi.hideSm{display:none} }

  function make(idx){visited.add(idx);const p=people[idx];
    const cs=(kids.get(idx)||[]).filter(c=>!visited.has(c)).map(make);
    cs.sort((a,b)=>{const t=rankFn(a.data)-rankFn(b.data);return t||a.data.name.localeCompare(b.data.name,'es');});
    return {data:p,children:cs};}
  const top=(kids.get('ROOT')||[]).filter(c=>!visited.has(c)).map(make);
  top.sort((a,b)=>{const t=rankFn(a.data)-rankFn(b.data);return t||a.data.name.localeCompare(b.data.name,'es');});
  return {data:SYN_ROOT,children:top};}

const ROLE_TIER_RANK={global:0,mx:1,br:2,other:3};
function buildNestedRoles(){
  const {people,parentOf}=MODEL; const kids=new Map();
  const add=(k,c)=>{if(!kids.has(k))kids.set(k,[]);kids.get(k).push(c);};
  people.forEach(p=>{if(p._i<0)return;const par=parentOf[p._i];
    if(par==='ROOTNODE')add('ROOT',p._i);else add(par,p._i);});
  const visited=new Set();
  function make(idx){visited.add(idx);const p=people[idx];
    const cs=(kids.get(idx)||[]).filter(c=>!visited.has(c)).map(make);
    cs.sort((a,b)=>ROLE_TIER_RANK[a.data.tier]-ROLE_TIER_RANK[b.data.tier]);
    return {data:p,children:cs};}
  const top=(kids.get('ROOT')||[]).filter(c=>!visited.has(c)).map(make);
  top.sort((a,b)=>ROLE_TIER_RANK[a.data.tier]-ROLE_TIER_RANK[b.data.tier]);
  return {data:SYN_ROOT,children:top};}
function buildNestedDispatch(){ return MODEL.kind==='roles' ? buildNestedRoles() : buildNested(); }

let NODE_W=228,NODE_H=78;
const ROW_GAP=14,COL_GAP=24,LEVEL_GAP=40,INDENT=44;
function modeForDepth(depth){
  const startHorizontal = curKey==='propuesta';
  const isOdd = depth % 2 === 1;
  return startHorizontal ? (isOdd ? 'horizontal' : 'vertical') : (isOdd ? 'vertical' : 'horizontal');
}
function measure(node){
  if(!node.children){ node.subtreeW=NODE_W; node.subtreeH=NODE_H; return; }
  node.children.forEach(measure);
  const mode=modeForDepth(node.depth+1);
  node._childMode=mode;
  if(mode==='vertical'){
    node.subtreeW=Math.max(NODE_W, INDENT+Math.max(...node.children.map(c=>c.subtreeW)));
    node.subtreeH=NODE_H+node.children.reduce((s,c)=>s+c.subtreeH+ROW_GAP,0);
  } else {
    node.subtreeW=Math.max(NODE_W, node.children.reduce((s,c)=>s+c.subtreeW,0)+COL_GAP*(node.children.length-1));
    node.subtreeH=NODE_H+LEVEL_GAP+Math.max(...node.children.map(c=>c.subtreeH));
  }
}
function positionNodes(node,x,y){
  node.x=x;node.y=y;
  if(!node.children)return;
  const mode=node._childMode;
  if(mode==='vertical'){
    let curY=y+NODE_H+ROW_GAP;
    node.children.forEach(c=>{positionNodes(c,x+INDENT,curY);curY+=c.subtreeH+ROW_GAP;});
  } else {
    const totalW=node.children.reduce((s,c)=>s+c.subtreeW,0)+COL_GAP*(node.children.length-1);
    let curX=x+NODE_W/2-totalW/2;
    const childY=y+NODE_H+LEVEL_GAP;
    node.children.forEach(c=>{
      const slotCenter=curX+c.subtreeW/2;
      positionNodes(c,slotCenter-NODE_W/2,childY);
      curX+=c.subtreeW+COL_GAP;
    });
  }
}
const svg=d3.select('#tree'),gViewport=d3.select('#viewport'),gLinks=d3.select('#links'),gNodes=d3.select('#nodes');
let root,i=0,searchTerm='',hidden=new Set(),curKey='pitaco';
const zoom=d3.zoom().scaleExtent([0.12,2]).on('zoom',e=>gViewport.attr('transform',e.transform));
svg.call(zoom).on('dblclick.zoom',null);
document.getElementById('stage').addEventListener('mousedown',()=>document.getElementById('stage').classList.add('grabbing'));
window.addEventListener('mouseup',()=>document.getElementById('stage').classList.remove('grabbing'));
function collapse(d){if(d.children){d._children=d.children;d._children.forEach(collapse);d.children=null;}}
function totalDesc(d){const k=d.children||d._children||[];let n=k.length;k.forEach(c=>n+=totalDesc(c));return n;}
function statusCls(p){if(p.synthRoot)return 'st-root';const cm=MODEL.catMap||STATUS;return cm[p.status]?cm[p.status].cls:'st-pdv';}
function matchesSearch(d){if(!searchTerm)return false;const t=norm(searchTerm);const p=d.data.data;
  return norm(p.name).includes(t)||norm(p.role).includes(t);}

function loadTree(){
  const nested=buildNestedDispatch();
  root=d3.hierarchy(nested,d=>d.children);root.x0=0;root.y0=0;
  if(root.children)root.children.forEach(c=>{if(c.children)c.children.forEach(collapse);});
  update(root);setTimeout(fitToScreen,60);}

function linkPath(mode,sx,sy,tx,ty){
  if(mode==='vertical') return `M${sx},${sy} V${ty} H${tx}`;
  const midY=(sy+ty)/2;
  return `M${sx},${sy} V${midY} H${tx} V${ty}`;
}
function anchorPoints(mode,nx,ny,tx,ty){
  if(mode==='vertical') return {sx:nx+22, sy:ny+NODE_H/2, tx2:tx, ty2:ty+NODE_H/2};
  return {sx:nx+NODE_W/2, sy:ny+NODE_H, tx2:tx+NODE_W/2, ty2:ty};
}

function update(source){
  measure(root);positionNodes(root,0,0);
  const nodes=root.descendants();
  const links=root.links();
  const onPath=new Set();
  if(searchTerm)root.each(d=>{if(matchesSearch(d)){let a=d;while(a){onPath.add(a);a=a.parent;}}});
  const node=gNodes.selectAll('g.node').data(nodes,d=>d.id||(d.id=++i));
  const enter=node.enter().append('g').attr('class','node')
    .attr('transform',()=>`translate(${source.x0},${source.y0})`).style('opacity',0);
  enter.append('foreignObject').attr('width',NODE_W).attr('height',NODE_H+20).append('xhtml:div').attr('class','node-inner');
  const all=enter.merge(node);
  all.select('.node-inner').html(d=>{const p=d.data.data;
    if(p.synthRoot){
      const isRoles=MODEL.kind==='roles';
      return `<div class="node-card st-root" style="height:${NODE_H}px">
      <div class="node-name" style="font-family:var(--display);font-size:15px">${isRoles?'CEO':DATASETS[curKey].label}</div>
      <div class="node-role">${isRoles?'Propuesta de estructura':'Estructura antes de la adquisición'}</div></div>`;}
    const kids=(d.children?d.children.length:0)+(d._children?d._children.length:0);
    const collapsed=!!d._children,tot=totalDesc(d);
    const pill=kids?`<div class="toggle">${collapsed?'+'+tot:'−'}</div>`:'';
    const st=(MODEL.catMap||STATUS)[p.status];
    const dept=p.dept?`<span class="tag dept">${p.dept}</span>`:'';
    const statusTag=`<span class="tag status">${st?st.label:''}</span>`;
    const isRolesKind=MODEL.kind==='roles';
    const nameStyle=isRolesKind?' style="white-space:normal;overflow:visible;text-overflow:unset;line-height:1.2;"':'';
    return `<div class="node-card ${statusCls(p)}" style="height:${NODE_H}px">
      <div class="node-name"${nameStyle}>${p.name.trim()}</div>
      <div class="node-role">${(p.role||'').trim()||'—'}</div>
      <div class="node-tags">${statusTag}${dept}</div>
      </div>${pill}`;});
  all.classed('dim',d=>{const p=d.data.data;if(p.synthRoot)return false;return hidden.has(p.cat);})
     .classed('match',d=>matchesSearch(d));
  all.transition().duration(400).attr('transform',d=>`translate(${d.x},${d.y})`).style('opacity',1);
  all.select('.node-inner').on('click',(e,d)=>{e.stopPropagation();
    if(d.children){d._children=d.children;d.children=null;}else if(d._children){d.children=d._children;d._children=null;}update(d);});
  node.exit().transition().duration(280).attr('transform',()=>`translate(${source.x},${source.y})`).style('opacity',0).remove();
  const link=gLinks.selectAll('path.link').data(links,d=>d.target.id);
  const le=link.enter().insert('path','g').attr('class','link').attr('d',()=>{
    const m=modeForDepth(source.depth+1);const a=anchorPoints(m,source.x0,source.y0,source.x0,source.y0);
    return linkPath(m,a.sx,a.sy,a.sx,a.sy);});
  le.merge(link).transition().duration(400)
    .attr('class',d=>onPath.has(d.target)&&onPath.has(d.source)?'link on-path':'link')
    .attr('d',d=>{const m=modeForDepth(d.target.depth);const a=anchorPoints(m,d.source.x,d.source.y,d.target.x,d.target.y);
      return linkPath(m,a.sx,a.sy,a.tx2,a.ty2);});
  link.exit().transition().duration(280).attr('d',()=>{
    const m=modeForDepth(source.depth+1);const a=anchorPoints(m,source.x,source.y,source.x,source.y);
    return linkPath(m,a.sx,a.sy,a.sx,a.sy);}).remove();
  nodes.forEach(d=>{d.x0=d.x;d.y0=d.y;});}

function fitToScreen(){const b=gNodes.node().getBBox();if(!b.width)return;
  const s=document.getElementById('stage').getBoundingClientRect();const pad=90;
  const scale=Math.min((s.width-pad)/b.width,(s.height-pad)/b.height,1.15);
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(s.width/2-(b.x+b.width/2)*scale,36-b.y*scale+16).scale(scale));}
function centerOn(d,scale=0.95){const s=document.getElementById('stage').getBoundingClientRect();
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(s.width/2-(d.x+NODE_W/2)*scale,s.height/2-(d.y+NODE_H/2)*scale).scale(scale));}

function buildKpis(){
  const cells=[];
  if(MODEL.kind==='roles'){
    const mgmt=MODEL.people.filter(p=>norm(p.track)==='management').length;
    const ic=MODEL.people.length-mgmt;
    const areas=new Set(MODEL.people.map(p=>(p.dept||'').trim())).size;
    cells.push({v:MODEL.people.length,k:'Roles totales'});
    cells.push({op:'·'});
    cells.push({v:mgmt,k:'Management',color:'var(--lmay)'});
    cells.push({op:'·'});
    cells.push({v:ic,k:'Individual Contributor',color:'var(--pdv)'});
    cells.push({op:'·'});
    cells.push({v:areas,k:'Áreas'});
  } else {
    const c=MODEL.counts,stay=c.stay,out=DEPARTURES.reduce((s,k)=>s+c[k],0),nuevos=c.new;
    const antes=stay+out,despues=stay+nuevos,pct=antes?Math.round(out/antes*100):0;
    cells.push({v:antes,k:'Antes'});
    cells.push({op:'−'});
    cells.push({v:out,k:'Salidas',cls:'drop',sub:'−'+pct+'%'});
    cells.push({op:'='});
    cells.push({v:stay,k:'Siguen',color:'var(--stay)'});
    if(nuevos>0){
      cells.push({op:'+'});
      cells.push({v:nuevos,k:'Nuevos',color:'var(--new)'});
      cells.push({op:'='});
      cells.push({v:despues,k:'Después'});
    }
  }
  document.getElementById('kpiCells').innerHTML=cells.map(c=>{
    if(c.op) return `<div class="kop">${c.op}</div>`;
    if(c.sep) return `<div style="width:1px;align-self:stretch;background:var(--line);margin:2px 4px"></div>`;
    const sub=c.sub?`<span class="sub">${c.sub}</span>`:'';
    return `<div class="kpi ${c.cls||''}"><span class="v" ${c.color?`style="color:${c.color}"`:''}>${c.v}</span><span class="k">${c.k}</span>${sub}</div>`;
  }).join('');
}
function renderHeader(){
  const cm=MODEL.catMap,order=MODEL.catOrder,c=MODEL.counts,denom=MODEL.people.length;
  buildKpis();
  if(MODEL.kind==='roles'){
    document.getElementById('barTot').textContent=denom+' roles propuestos';
  } else {
    const st=c.stay,out=DEPARTURES.reduce((s,k)=>s+c[k],0),nv=c.new;
    document.getElementById('barTot').textContent=(st+out)+' antes · '+(st+nv)+' después';
  }
  document.getElementById('barCap').textContent='Composición de la estructura';
  const bar=document.getElementById('bar');bar.innerHTML='';
  order.forEach(k=>{if(!c[k])return;const s=document.createElement('span');
    s.style.width=(c[k]/denom*100)+'%';s.style.background=cm[k].color;s.title=cm[k].label+': '+c[k];bar.appendChild(s);});
  const lg=document.getElementById('legend');lg.querySelectorAll('.row').forEach(n=>n.remove());
  lg.querySelector('h3').textContent = MODEL.kind==='roles' ? 'Alcance' : 'Motivo';
  order.forEach(k=>{if(!c[k])return;const row=document.createElement('div');row.className='row';if(hidden.has(k))row.classList.add('off');
    row.innerHTML=`<span class="sw" style="background:${cm[k].color}"></span><span>${cm[k].label}</span><span class="ct">${c[k]}</span>`;
    row.onclick=()=>{if(hidden.has(k))hidden.delete(k);else hidden.add(k);row.classList.toggle('off');update(root);};
    lg.appendChild(row);});}

function setSync(state,text){const d=document.getElementById('dotsync');d.className='dotsync '+state;document.getElementById('syncText').textContent=text;}
async function autoSync(key){
  const src=DATASETS[key].src; if(!src){setSync('snap','Snapshot local');return;}
  setSync('loading','Sincronizando…');
  try{
    const u=src+(src.includes('?')?'&':'?')+'_='+Date.now();
    const res=await fetch(u,{cache:'no-store'}); if(!res.ok) throw 0;
    const txt=await res.text();
    if(curKey!==key) return;
    const expected = DATASETS[key].kind==='roles' ? /reporte directo/i : /direct leader|reason/i;
    if(!expected.test(txt)) throw 0;
    buildModel(txt); renderHeader(); loadTree();
    setSync('live','Actualizado '+new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));
  }catch(e){ if(curKey===key) setSync('snap','Snapshot local'); }
}

function loadDataset(key){
  const ds=DATASETS[key];
  curKey=key;hidden=new Set();searchTerm='';document.getElementById('search').value='';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.ds===key));
  document.getElementById('title').textContent = ds.kind==='roles' ? 'Propuesta de estructura (sin nombres)' : ds.label+' · Estructura antes de la adquisición';
  SYN_ROOT.name = ds.kind==='roles' ? 'CEO' : ds.label;
  NODE_W = ds.kind==='roles' ? 280 : 228;
  NODE_H = ds.kind==='roles' ? 100 : 78;
  buildModel(ds.csv);renderHeader();loadTree();
  autoSync(key);}

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)loadDataset(b.dataset.ds);});
document.getElementById('zoomIn').onclick=()=>svg.transition().call(zoom.scaleBy,1.3);
document.getElementById('zoomOut').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.3);
document.getElementById('fit').onclick=fitToScreen;
let stmr;document.getElementById('search').oninput=e=>{searchTerm=e.target.value.trim();clearTimeout(stmr);stmr=setTimeout(()=>{
  if(searchTerm){let first=null;root.each(d=>{if(matchesSearch(d)){if(!first)first=d;let a=d.parent;while(a){if(a._children){a.children=a._children;a._children=null;}a=a.parent;}}});update(root);if(first)setTimeout(()=>centerOn(first),120);}else update(root);},200);};

loadDataset('pitaco');

</script>
